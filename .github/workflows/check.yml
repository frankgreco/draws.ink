# Pull-request checks. No secrets, no deploy.
name: Check

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Syntax, the limit tests, then a dry-run deploy, which also builds the
      # container image and so catches a broken Dockerfile.
      - run: pnpm run check
